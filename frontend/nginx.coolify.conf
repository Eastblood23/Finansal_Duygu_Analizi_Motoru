# Trust only the Docker address pool configured on our Coolify host.
# Traefik must keep forwardedHeaders.insecure=false and frontend must have no host ports.
geo $realip_remote_addr $from_coolify_proxy {
    default 0;
    172.20.0.0/16 1;
}

map "$from_coolify_proxy:$http_x_forwarded_proto" $finans_forwarded_proto {
    default $scheme;
    "1:https" https;
    "1:http" http;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;

    set_real_ip_from 172.20.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8000;

    location /api/ {
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Collapse the chain after validating the proxy, so API limits use the client IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $finans_forwarded_proto;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 135s;
        proxy_send_timeout 45s;
        proxy_cache off;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
