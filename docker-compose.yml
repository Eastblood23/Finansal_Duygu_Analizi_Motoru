version: '3.8'

services:
  api:
    build: .
    container_name: finans_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: finans_frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: finans_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finans_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finans_pass}
      POSTGRES_DB: ${POSTGRES_DB:-finans_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: finans_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
  hf_cache:
