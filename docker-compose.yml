services:
  api:
    build: .
    container_name: finans_api
    ports:
      - "127.0.0.1:8000:8000"
    # Only local administration and the internal Nginx proxy can reach this port.
    # Nginx replaces forwarded headers; do not publish this API port externally.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  worker:
    build: .
    container_name: finans_worker
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 45s
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import asyncio; from app.database import redis_client; assert asyncio.run(redis_client.exists('collector:heartbeat'))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: finans_frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: finans_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finans_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-finans_db}
    ports:
      # Local administration (pgAdmin); application uses postgres:5432 internally.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: finans_redis
    ports:
      # Local tools only; application uses redis:6379 internally.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  hf_cache:
